name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      release_name:
        description: 'Release Title'
        required: false
        default: 'Angband3D Release'

permissions:
  contents: write

env:
  ANGBAND_TAG: "4.2.6"

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pdcurses

      - name: Reconstruct engine fork & Build Engine
        shell: msys2 {0}
        run: |
          git clone --origin upstream --branch "$ANGBAND_TAG" --depth 1 \
            https://github.com/angband/angband.git engine
          cd engine
          git apply --verbose ../engine-patch/0001-bridge-frontend.patch
          cmake -G Ninja \
            -DSUPPORT_BRIDGE_FRONTEND=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -B build .
          cmake --build build

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          .\tools\package.ps1

      - name: Upload Windows Package
        uses: actions/upload-artifact@v4
        with:
          name: Angband3D-Windows-x64
          path: dist/Angband3D-Windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build & Package (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libncurses-dev zip

      - name: Reconstruct engine fork & Build Engine
        run: |
          git clone --origin upstream --branch "$ANGBAND_TAG" --depth 1 \
            https://github.com/angband/angband.git engine
          cd engine
          git apply --verbose ../engine-patch/0001-bridge-frontend.patch
          cmake -G Ninja \
            -DSUPPORT_BRIDGE_FRONTEND=ON \
            -DSUPPORT_GCU_FRONTEND=ON \
            -B build .
          cmake --build build
          cd ..

      - name: Build C# Client (Release)
        run: dotnet build client/angband3d.csproj -c Release

      - name: Package Linux ZIP
        run: |
          mkdir -p dist/Angband3D-Linux-x64/client
          mkdir -p dist/Angband3D-Linux-x64/engine/build/game

          # Copy client files & assets
          cp -r client/Main.tscn client/project.godot client/icon.svg client/assets client/scripts dist/Angband3D-Linux-x64/client/
          if [ -d client/.godot ]; then cp -r client/.godot dist/Angband3D-Linux-x64/client/; fi

          # Copy engine binaries & gamedata
          cp engine/build/game/angband dist/Angband3D-Linux-x64/engine/build/game/
          chmod +x dist/Angband3D-Linux-x64/engine/build/game/angband
          cp -r engine/build/game/lib dist/Angband3D-Linux-x64/engine/build/game/
          mkdir -p dist/Angband3D-Linux-x64/engine/build/game/lib/save

          # Copy documentation and launchers
          cp LICENSE README.md dist/Angband3D-Linux-x64/
          cat << 'EOF' > dist/Angband3D-Linux-x64/play.sh
          #!/bin/sh
          cd "$(dirname "$0")"
          if command -v godot >/dev/null 2>&1; then
              godot --path client -- "$@"
          elif command -v godot4 >/dev/null 2>&1; then
              godot4 --path client -- "$@"
          else
              echo "Godot 4 (.NET) was not found in PATH."
              echo "Playing in text mode (GCU)..."
              ./engine/build/game/angband -mgcu "$@"
          fi
          EOF
          chmod +x dist/Angband3D-Linux-x64/play.sh

          cd dist
          zip -r Angband3D-Linux-x64.zip Angband3D-Linux-x64
          cd ..

      - name: Upload Linux Package
        uses: actions/upload-artifact@v4
        with:
          name: Angband3D-Linux-x64
          path: dist/Angband3D-Linux-x64.zip
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: Prepare Assets
        run: |
          mkdir -p final-dist
          find release-packages -name "*.zip" -exec cp {} final-dist/ \;
          ls -la final-dist/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ inputs.release_name }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "title=Angband3D ${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: final-dist/*.zip
          generate_release_notes: true
          files: |
            dist/Angband3D-Windows-x64.zip
            dist/Angband3D-Linux-x64.zip
